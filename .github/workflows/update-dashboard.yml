name: Update Dashboard

on:
  schedule:
    # Every 6 hours. GitHub's contribution/star/language data doesn't
    # change fast enough to need anything tighter than this.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dashboard
        run: node scripts/generate-dashboard.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: true-brace05

      - name: Commit dashboard if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/dashboard.svg
          git diff --cached --quiet || git commit -m "chore: refresh dashboard [automated]"
          git push
